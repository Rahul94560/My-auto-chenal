// 1. यहाँ अपना AI Studio वाला API Key डालो
const GEMINI_API_KEY =AQ.Ab8RN6LckdyMwrQdL3_xyNl7LxwDCINB_RvvxRkK7nSuopd6KQ 

// 2. ये तुम्हारी कहानी वाला Prompt है
const PROMPT = `
तुम एक कॉमेडी Shorts राइटर हो।
रोज एक नई मजाकिया double meaning वाली कहानी लिखो, Husband-Wife या Pappu पर, 100 शब्दों में, हिंदी में।
कोई गंदा शब्द मत लिखना, सिर्फ इशारों वाली कॉमेडी।
Output इस Format में देना:
Title:...
Story:...
Description:...
Hashtags: #comedy #funny #shorts
`;

function createShortsStory() {
  // Gemini से कहानी बनवाना
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY;

  const payload = {
    "contents": [{ "parts": [{ "text": PROMPT }] }]
  };

  const response = UrlFetchApp.fetch(url, {
    method: "post",
    contentType: "application/json",
    payload: JSON.stringify(payload)
  });

  const result = JSON.parse(response.getContentText());
  const storyText = result.candidates[0].content.parts[0].text;

  Logger.log(storyText);

  // यहाँ से ये Text YouTube पर जाएगा
  // अगर तुम्हारा YouTube upload वाला code जुड़ा है तो वो इसी storyText को Video बना के अपलोड कर देगा
  uploadToYouTube(storyText);
}

function uploadToYouTube(text) {
  // यहाँ तुम्हारा YouTube वाला OAuth JSON काम करेगा
  // जो file तुमने डाउनलोड की थी client_secret वाली
  Logger.log("अब ये YouTube पर 6 बजे Upload होगा: " + text);
}

// 6 बजे का Timer
function set6BajeKaTimer() {
  ScriptApp.newTrigger('createShortsStory')
   .timeBased()
   .atHour(18) // शाम 6 बजे
   .everyDays(1)
   .create();
}
